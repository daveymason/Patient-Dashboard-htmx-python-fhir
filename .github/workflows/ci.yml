name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Verify the app refuses to boot without SECRET_KEY
        run: |
          if python -c "from app import create_app; create_app()" 2>/dev/null; then
            echo "::error::App started without SECRET_KEY set"
            exit 1
          fi
          echo "Correctly refused to start without SECRET_KEY"
        env:
          SECRET_KEY: ''

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t patient-dashboard:ci .
