<h2 class="text-primary"><i class="fas fa-users"></i> Patients</h2>

{% if error %}
<div class="alert alert-danger">
    <i class="fas fa-exclamation-triangle me-2"></i>
    <strong>Patient list could not be loaded.</strong> {{ error }}
</div>
{% endif %}

<div class="row mb-3">
    <div class="col-md-6">
        <div class="input-group">
            <input type="search" id="patient-search" name="q" class="form-control"
                   placeholder="Search by name, ID or identifier..."
                   aria-label="Search patients"
                   hx-post="/fhir/search_patients"
                   hx-trigger="keyup changed delay:500ms, search"
                   hx-target="#patients-table-body"
                   hx-indicator="#search-indicator">
            <span class="input-group-text">
                <i class="fas fa-search"></i>
                <span id="search-indicator" class="htmx-indicator spinner-border spinner-border-sm ms-2" role="status"></span>
            </span>
        </div>
    </div>
    {% if total is not none %}
    <div class="col-md-6 d-flex align-items-center justify-content-md-end text-muted">
        <small>{{ total }} patients on the record server</small>
    </div>
    {% endif %}
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th><i class="fas fa-id-card"></i> | ID</th>
                <th><i class="fas fa-user"></i> | Name</th>
                <th><i class="fas fa-genderless"></i> | Gender</th>
                <th><i class="fas fa-birthday-cake"></i> | Birth Date</th>
                <th><i class="fas fa-map-marker-alt"></i> | Address</th>
                <th><i class="fas fa-phone"></i> | Contact</th>
                <th><i class="fas fa-info-circle"></i> | Details</th>
            </tr>
        </thead>
        <tbody id="patients-table-body">
            {% include "patient_table_body.html" %}
        </tbody>
    </table>
</div>
