<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Sign In &mdash; FHIR Patient Dashboard</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4" style="min-width: 340px; max-width: 420px;">
        <div class="card-body text-center">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="" style="height: 48px;" class="mb-3">
            <h3 class="card-title mb-3">Sign In</h3>
            <p class="text-muted small">
                Access is limited to approved accounts. A new wallet must be
                activated by an administrator before it can sign in.
            </p>
            <button id="connectMetamaskBtn" class="btn btn-primary w-100 mb-2">
                Sign in with MetaMask
            </button>
            <div id="authStatus" class="mt-3 small" role="status" aria-live="polite"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
